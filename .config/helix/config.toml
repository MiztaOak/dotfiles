theme = "gruvbox_light"

[editor]
true-color = true
line-number = "relative"
cursorline = true

[editor.indent-guides]
character = "|"
render = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name"]
