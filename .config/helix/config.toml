theme = "gruvbox_trans"

[editor]
true-color = true
line-number = "relative"
cursorline = true
auto-format = false
clipboard-provider = "x-clip"

[editor.lsp]
display-inlay-hints = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
character = "|"
render = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name"]

[keys.normal]
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"

[keys.normal."space"]
"space" = "file_picker"
